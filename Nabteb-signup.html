<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabteb Examination Board {NEB}</title>
    <link rel="stylesheet" href="Nabteb.css">
</head>
<body>
    <div class="container nabteb-bm">
       <form action="" class="Nabteb-form">
        <h2>Nabteb Sign Up Board</h2>
       <input type="text"
        placeholder="Surname" required>
       <input type="text"
        placeholder="Firstname" required>
       <input type="text"
        placeholder="Middlename" required>
       <input type="number"
        placeholder="Phone Number" required>
       <input type="Email"
        placeholder="Email Address" required>
       <input type="Dep"
        placeholder="Department" required>
       <input type="password"
        placeholder="Create Password" required>
       <input type="password"
        placeholder="Confirm Password" required>
         <button>Sign Up</button>
         <p>Already have an account? 
            <a href="Nabteb-login.html"
            target="_blank">login</a></p>

       </form>    
    </div>
</body>
